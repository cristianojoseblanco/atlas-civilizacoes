<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo G · o app · Atlas das Civilizações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
:root{--noite:#1D2B36;--chip:#2A3C4A;--papel:#FFF6E3;--papel2:#F6E9CC;--carta:#fff;--contorno:#0F1A22;--tinta:#1D2B36;--suave:#5D5647;--ouro:#F2B33D;--feito:#2A9D8F;--alerta:#E5644A;--trancado:#D9D0BC;--trancado-esc:#B4AA93;--mar:#3D7F8F;--terra:#F1DCA6;--rio:#2B6576;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--mola:linear(0,0.009,0.035 2.1%,0.141 4.4%,0.723 12.9%,0.938,1.077 20.4%,1.121,1.149 24.3%,1.159,1.163 27%,1.154,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);
  --titulo:'Bricolage Grotesque',system-ui,sans-serif;--texto:'Nunito Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
.titulo{font-family:var(--titulo);font-weight:800;letter-spacing:-.01em}
.ic{flex:none;display:block}
.b3{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:15px;border:3px solid var(--contorno);background:var(--carta);font-size:16px;font-weight:900;box-shadow:0 5px 0 var(--contorno);transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out);white-space:nowrap}
.b3:active{transform:translateY(5px);box-shadow:0 0 0 var(--contorno)}
.b3.ouro{background:var(--ouro)}
.barra{display:block;height:12px;border-radius:999px;background:#E9DCC2;border:2.5px solid var(--contorno);overflow:hidden}
.barra > i{display:block;height:100%;background:var(--feito);border-radius:999px;transition:width 600ms var(--mola)}
/* casca */
.topo{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--noite);color:var(--papel)}
.marca{font-family:var(--titulo);font-weight:800;font-size:24px;margin-right:auto}
#chips{display:flex;gap:8px;align-items:center}
.chip{height:40px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;background:var(--chip);color:var(--papel);font-size:15px;font-weight:800}
.chip b{font-weight:900}
.chip.avatar{width:42px;height:42px;padding:0;overflow:hidden;background:#E9C99A;border:2.5px solid var(--papel);justify-content:center}
.chip.avatar svg{width:120%;height:auto;margin-top:8px}
.chip.avatar.premium{border-color:var(--ouro);box-shadow:0 0 0 2px var(--ouro)}
.casca{display:grid;grid-template-columns:96px 1fr;min-height:calc(100vh - 64px)}
.nav{position:sticky;top:64px;height:calc(100vh - 64px);display:flex;flex-direction:column;gap:6px;padding:14px 10px;border-right:3px solid var(--contorno);background:var(--papel2)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;font-size:13px;font-weight:900;color:var(--suave);border:3px solid transparent}
.nav a svg{width:28px;height:28px}
.nav a.ativo{background:var(--carta);border-color:var(--contorno);color:var(--tinta);box-shadow:0 4px 0 var(--contorno)}
.nav .tag{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--ouro);color:var(--tinta)}
#tela{min-width:0}
/* início */
.boas{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:26px;padding:34px 28px 10px}
.vj-grande{width:118px;flex:none}.vj-grande svg{width:100%;height:auto}
.boas h1{font-size:36px;line-height:40px;margin-bottom:14px}
.continuar{display:inline-grid;grid-template-columns:auto;padding:14px 20px;border-radius:18px;background:var(--ouro);border:3px solid var(--contorno);box-shadow:0 5px 0 var(--contorno);transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out)}
.continuar:active{transform:translateY(5px);box-shadow:none}
.continuar span{font-size:13px;font-weight:900}.continuar b{font:800 21px/25px var(--titulo)}.continuar small{font-size:14px;font-weight:700}
.abas{max-width:980px;margin:26px auto 0;padding:0 28px;display:flex;gap:10px}
.abas button{height:44px;padding:0 20px;border-radius:999px;border:3px solid var(--contorno);font-weight:900;font-size:16px;background:var(--carta)}
.abas button[aria-selected="true"]{background:var(--noite);color:var(--papel)}
.linha-tempo{max-width:980px;margin:0 auto;padding:22px 28px 80px;position:relative}
.linha-tempo::before{content:"";position:absolute;left:46px;top:30px;bottom:80px;width:5px;border-radius:3px;background:var(--trancado)}
.epoca{position:relative;display:flex;gap:22px;padding:10px 0 18px}
.epoca .ponto{position:relative;z-index:1;flex:none;width:42px;height:42px;margin-left:0;border-radius:50%;background:var(--trancado);border:3px solid var(--contorno)}
.epoca.tem .ponto{background:var(--ouro);box-shadow:0 4px 0 var(--contorno)}
.ep-corpo{flex:1;min-width:0;padding-top:4px}
.ate{font-size:13px;font-weight:900;color:var(--suave)}
.epoca h2{font-size:22px;line-height:26px}
.epoca p{font-size:15px;line-height:22px;max-width:62ch;margin:2px 0 8px;color:#3B3A36}
.epoca:not(.tem) h2,.epoca:not(.tem) p{opacity:.72}
.curso-card{display:flex;align-items:center;gap:16px;max-width:560px;padding:14px 16px;border-radius:18px;background:var(--carta);border:3px solid var(--contorno);box-shadow:0 5px 0 var(--contorno)}
.curso-card > div{flex:1;min-width:0}.curso-card b{display:block;font:800 19px var(--titulo)}.curso-card span{display:block;font-size:14px;font-weight:700;margin:2px 0 8px}
.curso-card .ir{flex:none;padding:10px 14px;border-radius:12px;background:var(--ouro);border:2.5px solid var(--contorno);font-weight:900;font-size:14px;margin:0}
.breve{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--papel2);border:2px dashed var(--trancado-esc);font-size:13px;font-weight:800;color:var(--suave)}
.temas{max-width:980px;margin:0 auto;padding:22px 28px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tema{padding:16px;border-radius:18px;background:var(--carta);border:3px solid var(--contorno)}
.tema h2{font-size:20px}.tema p{font-size:14px;line-height:20px;margin:4px 0 10px;color:#3B3A36}.tema .conta{display:block;font-size:13px;font-weight:900;margin-bottom:10px}
/* árvore */
.arvore-tela{display:grid;grid-template-columns:minmax(380px,520px) 1fr;height:calc(100vh - 64px)}
.arv-col{min-height:0;overflow:auto;border-right:3px solid var(--contorno);padding:0 18px 40vh}
.arv-cab{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:16px 0 12px;background:var(--papel)}
.voltar{width:40px;height:40px;border-radius:12px;border:3px solid var(--contorno);display:flex;align-items:center;justify-content:center;font:800 26px var(--titulo);background:var(--carta);box-shadow:0 3px 0 var(--contorno)}
.arv-cab span{font-size:13px;font-weight:900;color:var(--suave)}.arv-cab h1{font-size:26px;line-height:28px}
.arv-cab .prog{margin-left:auto;font-size:14px;font-weight:900;color:var(--tinta);white-space:nowrap}
.sel{position:sticky;top:76px;z-index:5;padding:14px;border-radius:18px;background:var(--noite);color:var(--papel);box-shadow:0 5px 0 var(--contorno);margin-bottom:12px}
.sel-l{display:flex;align-items:center;gap:12px}.sel-l > div{flex:1;min-width:0}
.sel-l span{display:block;font-size:12px;font-weight:800;opacity:.75}.sel-l b{display:block;font-size:20px;line-height:24px}.sel-l small{font-size:13px;font-weight:700;opacity:.8}
.sel .b3{height:46px}
.est-l{font-size:13px;font-weight:900;padding:6px 10px;border-radius:999px;background:var(--chip);white-space:nowrap}
.reqs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:800;opacity:.9}
.req{padding:3px 9px;border-radius:999px;background:var(--trancado);color:var(--tinta);font-size:12px;font-weight:800}
.req.ok{background:var(--feito);color:#fff}
.galho{padding-top:6px}
.galho-cab{display:flex;align-items:center;gap:10px;padding:10px 0 4px;border-top:3px solid var(--contorno)}
.galho-cab span{display:block;font-size:12px;font-weight:900;color:var(--suave)}.galho-cab b{display:block;font-size:19px;line-height:23px}
.galho-cab .est{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:900;white-space:nowrap}
.galho.fechado .galho-cab b{color:var(--suave)}
.nasce{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 0;font-size:12px;font-weight:800;color:var(--suave)}
.arv{position:relative;padding:22px 0 10px}
.ramos{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.ramos path{fill:none;stroke-width:5;stroke-linecap:round}.ramos .feita{stroke:var(--feito)}.ramos .aberta{stroke:var(--ouro);stroke-dasharray:1 11}.ramos .fechada{stroke:var(--trancado)}
.linha{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 10px;margin-bottom:30px}
.nd{width:118px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;line-height:16px;font-weight:800}
.linha.larga .nd{width:86px;font-size:12px}
.no{width:62px;height:62px;border-radius:50%;border:3px solid var(--contorno);display:flex;align-items:center;justify-content:center;font:800 24px var(--titulo);box-shadow:0 5px 0 var(--contorno);transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out)}
.linha.larga .no{width:52px;height:52px}
.no:active{transform:translateY(5px);box-shadow:none}
.no.feito{background:var(--feito);color:#fff}.no.atual{background:var(--ouro)}.no.proxima{background:var(--carta);border-style:dashed;box-shadow:none;color:var(--suave)}.no.trancado{background:var(--trancado);border-color:var(--trancado-esc);box-shadow:0 5px 0 var(--trancado-esc)}
.nd.foco .no{outline:4px solid var(--ouro);outline-offset:4px}
.nd.foco span{text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--ouro)}
.galho.fechado .nd span{color:var(--suave)}
.arv-mapa{position:relative;min-height:0;overflow:hidden;background:var(--mar)}
.campo{display:block;width:100%;height:100%}
.arv-mapa .mar{fill:var(--mar)}.arv-mapa .costa{fill:var(--contorno);stroke:var(--contorno);stroke-width:4px;stroke-linejoin:round;vector-effect:non-scaling-stroke}.arv-mapa .terra{fill:var(--terra)}.arv-mapa .lago{fill:var(--mar)}.arv-mapa .rio{fill:none;stroke:var(--rio);stroke-width:1.8px;vector-effect:non-scaling-stroke}
.trilha{fill:none;stroke-width:calc(var(--inv) * 4px);stroke-linecap:round}
.trilha.feita{stroke:var(--feito)}.trilha.aberta{stroke:var(--ouro-esc,#C98A12);stroke-dasharray:calc(var(--inv) * 2px) calc(var(--inv) * 8px)}.trilha.fechada{stroke:var(--contorno);opacity:.3;stroke-dasharray:calc(var(--inv) * 2px) calc(var(--inv) * 8px)}
.pin{cursor:pointer}
.pin circle{fill:var(--trancado);stroke:var(--contorno);stroke-width:3}
.pin.feito circle{fill:var(--feito)}.pin.atual circle{fill:var(--ouro)}.pin.proxima circle{fill:var(--carta);stroke-dasharray:4 3}
.pin text{font:800 14px var(--titulo);fill:var(--tinta)}.pin.feito text:not(.nm){fill:#fff}
.pin .nm{font-size:13px;paint-order:stroke;stroke:var(--terra);stroke-width:4px}
.pin.foco circle{r:17;stroke-width:4}
.sobre{position:absolute;inset:0;pointer-events:none}
.vj-anc{position:absolute;left:0;top:0;width:0;height:0}
.vj-anc .vj{position:absolute;left:-104px;top:-100px;width:76px;filter:drop-shadow(0 4px 0 rgba(15,26,34,.25))}
.vj svg{display:block;width:100%;height:auto}
.ano-m{position:absolute;left:16px;top:16px;height:42px;display:flex;align-items:center;padding:0 16px;border-radius:999px;background:var(--papel);border:3px solid var(--contorno);font:800 18px var(--titulo);box-shadow:0 4px 0 var(--contorno)}
/* perfil */
.perfil{max-width:900px;margin:0 auto;padding:28px 24px 100px;display:flex;flex-direction:column;gap:22px}
.cartao-perfil{display:flex;align-items:center;gap:22px;padding:20px;border-radius:22px;background:var(--carta);border:3px solid var(--contorno);box-shadow:0 6px 0 var(--contorno)}
.retrato{width:112px;height:112px;flex:none;border-radius:50%;overflow:hidden;background:#E9C99A;border:3px solid var(--contorno);display:flex;align-items:flex-end;justify-content:center}
.retrato svg{width:130%;height:auto;margin-bottom:-16px}
.quem{flex:1;min-width:0}
.quem h1{font-size:30px;line-height:34px}
.plano{display:inline-flex;align-items:center;gap:6px;margin:4px 0 12px;padding:4px 12px;border-radius:999px;background:var(--papel2);border:2px solid var(--contorno);font-size:13px;font-weight:900}
.plano.premium{background:var(--ouro)}
.nivel b{font:800 17px var(--titulo)}.nivel .barra{margin:6px 0 4px;max-width:420px}.nivel small{font-size:13px;font-weight:800;color:var(--suave)}
.numeros{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.num{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:18px;background:var(--carta);border:3px solid var(--contorno)}
.num b{font:800 22px/26px var(--titulo)}.num span{font-size:13px;font-weight:800;color:var(--suave)}
.premium-card{display:flex;align-items:center;gap:20px;padding:20px;border-radius:22px;background:var(--noite);color:var(--papel);box-shadow:0 6px 0 var(--contorno)}
.premium-card > div{flex:1}.premium-card b.titulo{display:block;font-size:24px;margin-bottom:8px;color:var(--ouro)}
.premium-card ul,.lista-p{list-style:none;display:flex;flex-direction:column;gap:8px}
.premium-card li,.lista-p li{display:flex;align-items:center;gap:10px;font-size:15px;line-height:20px}
.premium-on{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--ouro);border:3px solid var(--contorno)}
.premium-on b{display:block;font:800 19px var(--titulo)}.premium-on span{font-size:14px;font-weight:700}
.conquistas h2{font-size:24px;margin-bottom:12px}.conquistas h2 small{font:800 15px var(--texto);color:var(--suave);margin-left:8px}
.grade-c{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.conq{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:18px;background:var(--papel2);border:3px dashed var(--trancado-esc)}
.conq .conq-ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--trancado);border:3px solid var(--trancado-esc);filter:grayscale(1);opacity:.7;margin-bottom:4px}
.conq b{font:800 17px var(--titulo)}.conq p{font-size:13px;line-height:18px;font-weight:700;color:var(--suave)}
.conq small{font-size:12px;font-weight:800;color:var(--suave)}.conq .barra{height:10px;margin-top:4px}
.conq.ok{background:var(--carta);border-style:solid;border-color:var(--contorno);box-shadow:0 5px 0 var(--contorno)}
.conq.ok .conq-ic{background:#FFF0C9;border-color:var(--contorno);filter:none;opacity:1}
.ferramentas{padding:16px;border-radius:18px;border:3px dashed var(--suave)}
.ferramentas h2{font-size:18px}.ferramentas p{font-size:13px;font-weight:700;color:var(--suave);margin:4px 0 12px}
.ferramentas .bts{display:flex;flex-wrap:wrap;gap:10px}.ferramentas .b3{height:44px;font-size:14px;padding:0 14px}
/* janelas e avisos */
.janela{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,26,34,.55);animation:aparece 200ms ease}
.janela.sai{opacity:0;transition:opacity 200ms ease}
@keyframes aparece{from{opacity:0}}
.jan{width:min(460px,100%);padding:22px;border-radius:24px;background:var(--papel);border:3px solid var(--contorno);box-shadow:0 8px 0 var(--contorno);text-align:center;animation:sobe 320ms var(--mola)}
@keyframes sobe{from{transform:translateY(30px) scale(.96);opacity:0}}
.jan h2{font-size:24px;line-height:28px;margin:10px 0 8px}.jan p{font-size:15px;line-height:22px;font-weight:700;color:var(--suave)}
.jan .lista-p{text-align:left;margin:12px 0}.jan .nota{font-size:13px;margin-top:8px}
.jan .bts{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.jan-vj{width:120px;margin:0 auto}.jan-vj svg{width:100%;height:auto}
.hexes{display:flex;justify-content:center;gap:6px}.hexes span{filter:grayscale(1);opacity:.35}.hexes span.cheio{filter:none;opacity:1}
.conq-aviso{position:fixed;z-index:90;left:50%;top:76px;translate:-50% 0;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:18px;background:var(--noite);color:var(--papel);border:3px solid var(--contorno);box-shadow:0 6px 0 var(--contorno);animation:desce 600ms var(--mola)}
@keyframes desce{from{transform:translateY(-30px);opacity:0}}
.conq-aviso.sai{opacity:0;transform:translateY(-14px);transition:all 400ms ease}
.conq-aviso .conq-ic{width:48px;height:48px;border-radius:50%;background:#FFF0C9;border:3px solid var(--ouro);display:flex;align-items:center;justify-content:center}
.conq-aviso small{display:block;font-size:12px;font-weight:900;color:var(--ouro)}.conq-aviso b{font:800 18px var(--titulo)}
@media (max-width:899px){
  .topo{padding:0 12px}.marca{font-size:20px}.chip{padding:0 9px;height:36px;font-size:14px}
  .casca{display:block;padding-bottom:76px}
  .nav{position:fixed;z-index:40;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-right:none;border-top:3px solid var(--contorno)}
  .nav a{flex:1;padding:6px 2px;font-size:12px}.nav a svg{width:24px;height:24px}
  .boas{padding:22px 16px 6px;gap:14px}.vj-grande{width:80px}.boas h1{font-size:26px;line-height:30px}
  .abas,.linha-tempo,.temas{padding-left:16px;padding-right:16px}
  .linha-tempo::before{left:34px}
  .epoca{gap:14px}
  .curso-card{flex-direction:column;align-items:stretch}.curso-card .ir{text-align:center}
  .arvore-tela{display:flex;flex-direction:column;height:auto}
  .arv-mapa{order:-1;height:42vh;flex:none;position:sticky;top:64px;z-index:7;border-bottom:3px solid var(--contorno)}
  .arv-col{overflow:visible;border-right:none;padding:0 12px 50vh}
  .arv-cab{position:static}
  .sel{top:calc(64px + 42vh + 6px)}
  .vj-anc .vj{width:58px;left:-78px;top:-76px}
  .numeros{grid-template-columns:repeat(2,1fr)}
  .cartao-perfil{flex-direction:column;text-align:center}.nivel .barra{margin-left:auto;margin-right:auto}
  .premium-card{flex-direction:column;align-items:stretch}
  .perfil{padding:18px 14px 100px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<header class="topo"><a class="marca" href="#inicio">Atlas</a><div id="chips"></div></header>
<div class="casca">

<script>// Estado do jogador, compartilhado entre o app (prototipo-g) e a lição (prototipo-f).
// Fica no navegador até existir conta (Supabase). Regras: XP 10 de primeira, 5 na segunda, 30 por lição;
// nível n exige 40·(n−1)² XP; energia 5 por dia, 1 por seção nova, revisão grátis; Premium sem limite de energia.
const Estado = (() => {
  const K = 'atlas-estado-v1', ENERGIA_DIA = 5;
  const dia = (d = new Date()) => d.toISOString().slice(0, 10);
  const ontem = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dia(d); };
  const padrao = () => ({xp: 0, energia: ENERGIA_DIA, diaEnergia: dia(), seq: 0, ultimoDia: null, feitos: [], secoes: {}, respostas: 0, primeira: 0, seguidas: 0, maxSeguidas: 0, melhorKm: null, escriba: false, galhos: 0, conquistas: {}, premium: false, novas: []});
  let s;
  try { s = {...padrao(), ...JSON.parse(localStorage.getItem(K) || '{}')}; } catch (e) { s = padrao(); }
  if (s.diaEnergia !== dia()) { s.energia = ENERGIA_DIA; s.diaEnergia = dia(); }
  const salva = () => { try { localStorage.setItem(K, JSON.stringify(s)); } catch (e) {} };

  const xpDoNivel = n => 40 * (n - 1) ** 2;
  const nivel = xp => { let n = 1; while (xpDoNivel(n + 1) <= xp) n++; return n; };

  const CONQUISTAS = [
    {id: 'primeira-cidade', nome: 'Primeira cidade', desc: 'Concluir a primeira lição.', ic: 'cidade', meta: 1, valor: () => s.feitos.length},
    {id: 'cartografo', nome: 'Cartógrafo', desc: 'Achar um lugar no mapa a menos de 40 km.', ic: 'alvo', meta: 1, valor: () => s.melhorKm !== null && s.melhorKm <= 40 ? 1 : 0},
    {id: 'na-mosca', nome: 'Na mosca', desc: 'Acertar 5 tarefas seguidas de primeira.', ic: 'raio', meta: 5, valor: () => s.maxSeguidas},
    {id: 'escriba', nome: 'Escriba', desc: 'Ordenar o nascimento da escrita de primeira.', ic: 'tablete', meta: 1, valor: () => s.escriba ? 1 : 0},
    {id: 'seq-3', nome: 'Três dias', desc: 'Estudar 3 dias seguidos.', ic: 'chama', meta: 3, valor: () => s.seq},
    {id: 'seq-7', nome: 'Uma semana', desc: 'Estudar 7 dias seguidos.', ic: 'chama', meta: 7, valor: () => s.seq},
    {id: 'seq-30', nome: 'Um mês', desc: 'Estudar 30 dias seguidos.', ic: 'chama', meta: 30, valor: () => s.seq},
    {id: 'galho', nome: 'Galho completo', desc: 'Concluir todas as lições de um galho.', ic: 'galho', meta: 1, valor: () => s.galhos},
    {id: 'curso', nome: 'Oriente Antigo', desc: 'Concluir as 32 lições do curso.', ic: 'coroa', meta: 32, valor: () => s.feitos.length},
  ];
  function checa(){
    CONQUISTAS.forEach(c => { if (!s.conquistas[c.id] && c.valor() >= c.meta) { s.conquistas[c.id] = dia(); s.novas.push(c.id); } });
    salva();
  }
  function marcaDia(){
    const h = dia(); if (s.ultimoDia === h) return;
    s.seq = s.ultimoDia === ontem() ? s.seq + 1 : 1; s.ultimoDia = h;
  }
  return {
    get: () => s,
    nivel, xpDoNivel, CONQUISTAS, ENERGIA_DIA,
    ganhaXp(n){ s.xp += n; salva(); },
    resposta(dePrimeira){ s.respostas++; if (dePrimeira) { s.primeira++; s.seguidas++; s.maxSeguidas = Math.max(s.maxSeguidas, s.seguidas); } else s.seguidas = 0; checa(); },
    km(d){ if (s.melhorKm === null || d < s.melhorKm) s.melhorKm = d; checa(); },
    marca(chave){ s[chave] = true; checa(); },
    // gasta 1 energia para uma seção nova; revisão e Premium não gastam
    podeEstudar(licao, secao){ return s.premium || (s.secoes[licao] ?? -1) >= secao || s.energia > 0; },
    entraSecao(licao, secao){ if (s.premium || (s.secoes[licao] ?? -1) >= secao) return true; if (s.energia <= 0) return false; s.energia--; salva(); return true; },
    terminaSecao(licao, secao){ s.secoes[licao] = Math.max(s.secoes[licao] ?? -1, secao); marcaDia(); checa(); },
    conclui(licao, galhosCompletos){ if (!s.feitos.includes(licao)) { s.feitos.push(licao); s.xp += 30; } if (galhosCompletos !== undefined) s.galhos = galhosCompletos; marcaDia(); checa(); },
    define(campos){ Object.assign(s, campos); checa(); },
    premium(v){ s.premium = v; salva(); },
    zera(){ const p = s.premium; s = padrao(); s.premium = p; salva(); },
    novas(){ const n = s.novas.splice(0); salva(); return n.map(id => CONQUISTAS.find(c => c.id === id)); },
  };
})();

// ícones das conquistas e da interface (traço de tabuleiro)
const ICONES = {
  cidade: '<path d="M4 20V11h4V7h5v4h3V8h4v12Z" fill="#E9C99A" stroke="#0F1A22" stroke-width="2" stroke-linejoin="round"/>',
  alvo: '<circle cx="12" cy="12" r="8.5" fill="#fff" stroke="#0F1A22" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="#E5644A" stroke="#0F1A22" stroke-width="2"/>',

  tablete: '<rect x="5" y="3" width="14" height="18" rx="3" fill="#C98F5A" stroke="#0F1A22" stroke-width="2"/><path d="M8 8l2 2M12 8h4M8 13h8M8 17h5" stroke="#0F1A22" stroke-width="1.8" stroke-linecap="round"/>',
  chama: '<path d="M12 2c2.4 4.3 7 6.6 7 12.2a7 7 0 0 1-14 0c0-3.4 2.2-4.8 3.4-8 1.2 2.3 2.2 3.4 3.5 3.4 0-3.4-1-5.5.1-7.6z" fill="#E5644A" stroke="#0F1A22" stroke-width="2" stroke-linejoin="round"/>',
  galho: '<circle cx="12" cy="4.5" r="2.5" fill="#2A9D8F" stroke="#0F1A22" stroke-width="1.8"/><circle cx="5" cy="19" r="2.5" fill="#2A9D8F" stroke="#0F1A22" stroke-width="1.8"/><circle cx="19" cy="19" r="2.5" fill="#2A9D8F" stroke="#0F1A22" stroke-width="1.8"/><path d="M12 7v5M12 12l-5.5 4.6M12 12l5.5 4.6" stroke="#0F1A22" stroke-width="2" stroke-linecap="round"/>',
  coroa: '<path d="M3 18L2 7l5 4 5-7 5 7 5-4-1 11Z" fill="#F2B33D" stroke="#0F1A22" stroke-width="2" stroke-linejoin="round"/>',
  energia: '<path d="M12 2l8.5 5v10L12 22l-8.5-5V7z" fill="#2A9D8F" stroke="#0F1A22" stroke-width="2" stroke-linejoin="round"/>',
  moeda: '<circle cx="12" cy="12" r="9" fill="#F2B33D" stroke="#0F1A22" stroke-width="2"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 0 1 0 3.5h-3a1.8 1.8 0 0 0 0 3.5h4" stroke="#0F1A22" stroke-width="1.6" stroke-linecap="round"/>',
  estrela: '<path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#F2B33D" stroke="#0F1A22" stroke-width="2" stroke-linejoin="round"/>',
  cadeado: '<rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="#B4AA93" stroke="#0F1A22" stroke-width="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="#0F1A22" stroke-width="2"/>',
};
const ic = (k, t = 24) => `<svg class="ic" width="${t}" height="${t}" viewBox="0 0 24 24" aria-hidden="true">${ICONES[k]}</svg>`;
const numBR = n => n >= 1e6 ? `${(n / 1e6).toLocaleString('pt-BR', {maximumFractionDigits: 1})} milhões` : n >= 1e4 ? `${(n / 1e3).toLocaleString('pt-BR', {maximumFractionDigits: 1})} mil` : n.toLocaleString('pt-BR');
function avisoConquistas(){
  Estado.novas().forEach((c, i) => setTimeout(() => {
    const a = document.createElement('div'); a.className = 'conq-aviso'; a.setAttribute('role', 'status');
    a.innerHTML = `<span class="conq-ic">${ic(c.ic, 30)}</span><div><small>Conquista nova</small><b>${c.nome}</b></div>`;
    document.body.appendChild(a); setTimeout(() => a.classList.add('sai'), 3200); setTimeout(() => a.remove(), 3700);
  }, i * 900));
}
</script>

<script>(() => {
// Protótipo G: o app em volta das lições. Início (épocas e temas), árvore do curso no mapa, perfil e Premium.
const $ = s => document.querySelector(s);
const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
const M = DADOS.mapa, VJ = DADOS.vj, U = DADOS.unidades, NS = 'http://www.w3.org/2000/svg';
const anoTxt = a => a < 0 ? `${Math.abs(a)} a.C.` : `${a} d.C.`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const TODAS = [], POR_ID = {};
U.forEach((u, ui) => u.licoes.forEach((l, li) => { l.ui = ui; l.li = li; l.gi = TODAS.length; TODAS.push(l); POR_ID[l.id] = l; }));
const LICAO_URL = 'prototipo-f.html';
const feitos = () => new Set(Estado.get().feitos);
const estado = l => { const f = feitos(); return f.has(l.id) ? 'feito' : !l.requisitos.every(r => f.has(r)) ? 'trancado' : l.publicada ? 'atual' : 'proxima'; };
const NOME_EST = {feito: 'Concluída', atual: 'Disponível', proxima: 'Em preparação', trancado: 'Bloqueada'};
const galhosCompletos = () => U.filter(u => u.licoes.every(l => feitos().has(l.id))).length;

// ---------- barra de cima e navegação ----------
function topo(){
  const s = Estado.get(), n = Estado.nivel(s.xp);
  $('#chips').innerHTML = `<a class="chip" href="#perfil" aria-label="Sequência de ${s.seq} dias">${ic('chama', 20)}<b>${s.seq}</b></a>
    <button class="chip" id="chipEn" aria-label="Energia">${ic('energia', 20)}<b>${s.premium ? '∞' : s.energia}</b></button>
    <a class="chip" href="#perfil" aria-label="${s.xp} XP, nível ${n}">${ic('moeda', 20)}<b>${numBR(s.xp)}</b></a>
    <a class="chip avatar${s.premium ? ' premium' : ''}" href="#perfil" aria-label="Perfil">${VJ.retrato}</a>`;
  $('#chipEn').onclick = () => modalEnergia();
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('ativo', location.hash.startsWith(a.getAttribute('href'))));
}

// ---------- início: épocas e temas ----------
let aba = 'epocas';
function inicio(){
  const s = Estado.get(), cur = TODAS.find(l => estado(l) === 'atual') || TODAS.find(l => estado(l) === 'proxima');
  const nf = TODAS.filter(l => feitos().has(l.id)).length;
  let h = `<section class="boas"><div class="vj-grande">${VJ.parado}</div><div><h1 class="titulo">Para onde vamos hoje?</h1>
    ${cur ? `<a class="continuar" href="${cur.publicada ? LICAO_URL : '#arvore/oriente-antigo'}" data-lic="${cur.id}"><span>${cur.publicada ? 'Continuar' : 'Próxima lição'}</span><b>${esc(cur.titulo)}</b><small>${esc(cur.lugar)} · ${anoTxt(cur.ano)}</small></a>` : ''}</div></section>
    <div class="abas" role="tablist"><button role="tab" aria-selected="${aba === 'epocas'}" data-a="epocas">Épocas</button><button role="tab" aria-selected="${aba === 'temas'}" data-a="temas">Temas</button></div>`;
  if (aba === 'epocas') {
    h += `<div class="linha-tempo">${DADOS.epocas.map(e => {
      const curso = DADOS.cursos.find(c => c.epocas.includes(e.id));
      const tem = !!curso, bloq = !tem && !s.premium;
      return `<article class="epoca${tem ? ' tem' : ''}">
        <span class="ponto" aria-hidden="true"></span>
        <div class="ep-corpo"><span class="ate">${e.periodo}</span><h2 class="titulo">${esc(e.nome)}</h2><p>${esc(e.descricao)}</p>
        ${tem ? `<a class="curso-card" href="#arvore/${curso.id}"><div><b>${esc(curso.titulo)}</b><span>${curso.licoes} lições · ${nf} de ${curso.licoes} concluídas (${pct(nf, curso.licoes)}%)</span><i class="barra"><i style="width:${pct(nf, curso.licoes)}%"></i></i></div><span class="ir">Abrir árvore</span></a>`
          : `<div class="breve">${bloq ? `${ic('cadeado', 18)} Premium · ` : ''}Curso em preparação</div>`}</div></article>`; }).join('')}</div>`;
  } else {
    h += `<div class="temas">${DADOS.temas.map(t => `<article class="tema"><h2 class="titulo">${esc(t.nome)}</h2><p>${esc(t.descricao)}</p><span class="conta">${numBR(t.lugares)} lugares e ${numBR(t.eventos)} eventos no atlas</span><div class="breve">${s.premium ? '' : `${ic('cadeado', 18)} Premium · `}Trilha em preparação</div></article>`).join('')}</div>`;
  }
  $('#tela').innerHTML = h;
  document.querySelectorAll('.abas button').forEach(b => b.onclick = () => { aba = b.dataset.a; inicio(); });
  const c = $('.continuar'); if (c && c.dataset.lic) c.onclick = e => { const l = POR_ID[c.dataset.lic]; if (l.publicada) { e.preventDefault(); comecar(l); } };
}

// ---------- árvore do curso, com o mapa ----------
let foco = null;
function arvore(){
  const ds = $('#tela'); ds.innerHTML = `<div class="arvore-tela"><div class="arv-col"><header class="arv-cab"><a href="#inicio" class="voltar" aria-label="Voltar">‹</a><div><span>Primeiras cidades → Impérios</span><h1 class="titulo">Oriente Antigo</h1></div><span class="prog" id="progCurso"></span></header><div class="sel" id="selLicao"></div><div class="galhos" id="galhos"></div></div><div class="arv-mapa" id="mapa"></div></div>`;
  montaMapa();
  const f = feitos(); $('#progCurso').textContent = `${f.size} de ${TODAS.length} (${pct(f.size, TODAS.length)}%)`;
  let h = '';
  U.forEach((u, ui) => {
    const ls = u.licoes, nf = ls.filter(l => f.has(l.id)).length, aberto = ls.some(l => estado(l) !== 'trancado');
    const ext = [...new Set(ls.flatMap(l => l.requisitos).filter(r => POR_ID[r].ui !== ui))];
    const nivel = {}; const lv = l => nivel[l.id] ?? (nivel[l.id] = Math.max(0, ...l.requisitos.filter(r => POR_ID[r].ui === ui).map(r => lv(POR_ID[r]) + 1)));
    ls.forEach(lv); const linhas = []; ls.forEach(l => (linhas[nivel[l.id]] ??= []).push(l));
    h += `<section class="galho${aberto ? '' : ' fechado'}" data-ui="${ui}"><div class="galho-cab"><div><span>Galho ${ui + 1} · ${esc(u.periodo)}</span><b class="titulo">${esc(u.titulo)}</b></div><span class="est">${nf === ls.length ? 'Concluído' : aberto ? `${nf} de ${ls.length}` : `${ic('cadeado', 16)} Bloqueado`}</span></div>
      ${ext.length ? `<div class="nasce">Nasce de ${ext.map(r => `<span class="req${f.has(r) ? ' ok' : ''}">${esc(POR_ID[r].titulo)}</span>`).join('')}</div>` : ''}
      <div class="arv"><svg class="ramos" aria-hidden="true"></svg>${linhas.map(row => `<div class="linha${row.length >= 4 ? ' larga' : ''}">${row.map(l => { const e = estado(l); return `<div class="nd" data-id="${l.id}"><button class="no ${e}" aria-label="${esc(l.titulo)}, ${NOME_EST[e]}">${e === 'feito' ? '✓' : e === 'trancado' ? ic('cadeado', 22) : e === 'proxima' ? '…' : ic('estrela', 24)}</button><span>${esc(l.titulo)}</span></div>`; }).join('')}</div>`).join('')}</div></section>`;
  });
  $('#galhos').innerHTML = h;
  document.querySelectorAll('.nd').forEach(n => n.querySelector('.no').onclick = () => escolhe(POR_ID[n.dataset.id], true));
  requestAnimationFrame(ramos);
  const ini = foco || TODAS.find(l => estado(l) === 'atual') || TODAS.find(l => estado(l) === 'proxima') || TODAS[0];
  escolhe(ini, false);
  document.querySelector(`.nd[data-id="${ini.id}"]`)?.scrollIntoView({block: 'center'});
}
function ramos(){
  const f = feitos();
  document.querySelectorAll('.galho').forEach(g => {
    const arv = g.querySelector('.arv'), svg = arv.querySelector('.ramos'), R = arv.getBoundingClientRect(); svg.setAttribute('width', R.width); svg.setAttribute('height', R.height);
    let p = ''; g.querySelectorAll('.nd').forEach(n => { const l = POR_ID[n.dataset.id];
      l.requisitos.filter(r => POR_ID[r].ui === l.ui).forEach(r => { const a = g.querySelector(`.nd[data-id="${r}"]`).getBoundingClientRect(), b = n.querySelector('.no').getBoundingClientRect();
        const x1 = a.left + a.width / 2 - R.left, y1 = a.bottom - R.top + 4, x2 = b.left + b.width / 2 - R.left, y2 = b.top - R.top - 4, my = (y1 + y2) / 2;
        p += `<path class="${f.has(r) ? (f.has(l.id) ? 'feita' : 'aberta') : 'fechada'}" d="M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}"/>`; }); });
    svg.innerHTML = p; });
}
function escolhe(l, anima){
  foco = l; const e = estado(l), s = Estado.get();
  document.querySelectorAll('.nd').forEach(n => n.classList.toggle('foco', n.dataset.id === l.id));
  const f = feitos();
  const botao = e === 'atual' ? `<button class="b3 ouro" id="comecar">${(s.secoes[l.id] ?? -1) >= 0 ? 'Continuar' : 'Começar'}</button>`
    : e === 'feito' && l.publicada ? `<button class="b3" id="comecar">Revisar</button>` : `<span class="est-l ${e}">${NOME_EST[e]}</span>`;
  $('#selLicao').innerHTML = `<div class="sel-l"><div><span>${esc(U[l.ui].titulo)} · lição ${l.li + 1}</span><b class="titulo">${esc(l.titulo)}</b><small>${esc(l.lugar)} · ${anoTxt(l.ano)}</small></div>${botao}</div>
    ${l.requisitos.length ? `<div class="reqs">${e === 'trancado' ? 'Para abrir, conclua: ' : 'Requisitos: '}${l.requisitos.map(r => `<span class="req${f.has(r) ? ' ok' : ''}">${esc(POR_ID[r].titulo)}</span>`).join('')}</div>` : ''}`;
  const b = $('#comecar'); if (b) b.onclick = () => comecar(l);
  // no mapa: os lugares do galho, a lição escolhida em destaque e o Viajante ao lado
  pinos(l.ui); destaca(l);
  // o mapa mostra a lição com o que vem antes e o que ela abre: perto quando é perto, longe quando é longe
  const viz = [l.id, ...l.requisitos, ...TODAS.filter(x => x.requisitos.includes(l.id)).map(x => x.id)];
  enquadra(viz, anima);
}
function comecar(l){
  const s = Estado.get(), secao = Math.min((s.secoes[l.id] ?? -1) + 1, 4);
  if (!Estado.podeEstudar(l.id, secao)) return modalEnergia(true);
  location.href = LICAO_URL;
}

// mapa 2D da árvore (mesmo desenho do protótipo F)
let W = 0, H = 0, cam = {x: 0, y: 0, s: 1}, camAnim = null, vjAnc = null;
const proj = (lon, lat) => [(lon - M.lon0) * M.kx, (M.lat1 - lat) * M.k];
const escalaBase = () => Math.max(W / M.w, H / M.h);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function montaMapa(){
  $('#mapa').innerHTML = `<svg class="campo" id="campo"><g id="cam">${M.svg}<g id="fx"></g></g></svg><div class="sobre" id="sobre"></div><span class="ano-m" id="anoM"></span>`;
  const r = $('#mapa').getBoundingClientRect(); W = r.width; H = r.height; $('#campo').setAttribute('viewBox', `0 0 ${W} ${H}`);
  vjAnc = null;
}
function poeCamera(c){ cam = c; $('#cam').setAttribute('transform', `translate(${W / 2 - c.x * c.s} ${H / 2 - c.y * c.s}) scale(${c.s})`); $('#cam').style.setProperty('--inv', 1 / c.s); posVj(); }
function vaiCamera(x, y, s, anima){
  cancelAnimationFrame(camAnim); const alvo = {x, y, s};
  if (!anima || reduzir) return poeCamera(alvo);
  const de = {...cam}, t0 = performance.now();
  const f = t => { const k = Math.min(1, (t - t0) / 1300), e = easeIO(k); poeCamera({x: de.x + (alvo.x - de.x) * e, y: de.y + (alvo.y - de.y) * e, s: Math.exp(Math.log(de.s) + (Math.log(alvo.s) - Math.log(de.s)) * e)}); if (k < 1) camAnim = requestAnimationFrame(f); };
  camAnim = requestAnimationFrame(f);
}
function enquadra(ids, anima){
  const ps = ids.map(id => proj(POR_ID[id].lon, POR_ID[id].lat)), xs = ps.map(p => p[0]), ys = ps.map(p => p[1]);
  const bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
  const s = Math.max(escalaBase() * 1.1, Math.min(escalaBase() * 5, W * .6 / Math.max(bw, 1), H * .55 / Math.max(bh, 1)));
  vaiCamera((Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2, s, anima);
}
function pinos(ui){
  const fx = $('#fx'); fx.innerHTML = '';
  // requisitos entre lugares do galho, como trilhas pontilhadas
  const f = feitos();
  U[ui].licoes.forEach(l => l.requisitos.filter(r => POR_ID[r].ui === ui).forEach(r => { const a = proj(POR_ID[r].lon, POR_ID[r].lat), b = proj(l.lon, l.lat);
    const p = document.createElementNS(NS, 'path'); p.setAttribute('class', 'trilha ' + (f.has(r) ? (f.has(l.id) ? 'feita' : 'aberta') : 'fechada')); p.setAttribute('d', `M${a[0]} ${a[1]}Q${(a[0] + b[0]) / 2 - (b[1] - a[1]) * .15} ${(a[1] + b[1]) / 2 + (b[0] - a[0]) * .15} ${b[0]} ${b[1]}`); fx.appendChild(p); }));
  const grupos = {};
  U[ui].licoes.forEach(l => { const k = l.lon + ',' + l.lat; (grupos[k] ??= []).push(l); });
  U[ui].licoes.forEach(l => {
    const g = grupos[l.lon + ',' + l.lat], k = g.indexOf(l), [x, y] = proj(l.lon, l.lat), e = estado(l);
    const m = document.createElementNS(NS, 'g'); m.setAttribute('class', `pin ${e}`); m.dataset.id = l.id;
    m.style.transform = `translate(${x}px, ${y}px) scale(var(--inv))`;
    m.innerHTML = `<g transform="translate(${(k - (g.length - 1) / 2) * 30} 0)"><circle r="13"/><text y="4.5" text-anchor="middle">${l.li + 1}</text><text class="nm" y="30" text-anchor="middle">${esc(l.lugar.split(' (')[0])}</text></g>`;
    m.onclick = () => { escolhe(l, true); document.querySelector(`.nd[data-id="${l.id}"]`)?.scrollIntoView({behavior: 'smooth', block: 'center'}); };
    fx.appendChild(m);
  });
}
function destaca(l){
  document.querySelectorAll('.pin').forEach(p => p.classList.toggle('foco', p.dataset.id === l.id));
  if (!vjAnc) { const d = document.createElement('div'); d.className = 'vj-anc'; d.innerHTML = `<div class="vj">${VJ.parado}</div>`; $('#sobre').appendChild(d); vjAnc = {el: d, x: 0, y: 0}; }
  [vjAnc.x, vjAnc.y] = proj(l.lon, l.lat); posVj();
  vjAnc.el.querySelector('.vj').animate([{transform: 'translateY(-14px)', opacity: .4}, {transform: 'none', opacity: 1}], {duration: 500, easing: 'cubic-bezier(0.23,1,0.32,1)'});
  $('#anoM').textContent = anoTxt(l.ano);
}
function posVj(){ if (!vjAnc) return; vjAnc.el.style.transform = `translate(${(vjAnc.x - cam.x) * cam.s + W / 2}px, ${(vjAnc.y - cam.y) * cam.s + H / 2}px)`; }

// ---------- perfil ----------
function perfil(){
  const s = Estado.get(), n = Estado.nivel(s.xp), a = Estado.xpDoNivel(n), b = Estado.xpDoNivel(n + 1);
  const nf = s.feitos.length, ganhas = Estado.CONQUISTAS.filter(c => s.conquistas[c.id]).length;
  $('#tela').innerHTML = `<div class="perfil">
    <section class="cartao-perfil"><div class="retrato">${VJ.retrato}</div><div class="quem"><h1 class="titulo">Viajante</h1><span class="plano ${s.premium ? 'premium' : ''}">${s.premium ? `${ic('estrela', 16)} Premium` : 'Plano grátis'}</span>
      <div class="nivel"><b>Nível ${n}</b><i class="barra"><i style="width:${pct(s.xp - a, b - a)}%"></i></i><small>${numBR(s.xp - a)} de ${numBR(b - a)} XP até o nível ${n + 1}</small></div></div></section>
    <section class="numeros">
      <div class="num">${ic('moeda', 28)}<b>${numBR(s.xp)}</b><span>XP no total</span></div>
      <div class="num">${ic('chama', 28)}<b>${s.seq}</b><span>${s.seq === 1 ? 'dia seguido' : 'dias seguidos'}</span></div>
      <div class="num">${ic('energia', 28)}<b>${s.premium ? '∞' : `${s.energia} de ${Estado.ENERGIA_DIA}`}</b><span>energia hoje</span></div>
      <div class="num">${ic('galho', 28)}<b>${nf} de ${TODAS.length}</b><span>lições (${pct(nf, TODAS.length)}%)</span></div>
      <div class="num">${ic('alvo', 28)}<b>${s.primeira} de ${s.respostas}</b><span>tarefas de primeira (${pct(s.primeira, s.respostas)}%)</span></div>
    </section>
    ${s.premium ? `<section class="premium-on">${ic('estrela', 26)}<div><b>Você é Premium</b><span>Energia sem limite, todas as épocas, o atlas completo e a revisão inteligente.</span></div></section>`
      : `<section class="premium-card"><div><b class="titulo">Atlas Premium</b><ul>${BENEF.map(x => `<li>${ic(x[0], 20)}<span><b>${x[1]}</b> ${x[2]}</span></li>`).join('')}</ul></div><button class="b3 ouro" id="verPremium">Ver o Premium</button></section>`}
    <section class="conquistas"><h2 class="titulo">Conquistas <small>${ganhas} de ${Estado.CONQUISTAS.length}</small></h2><div class="grade-c">${Estado.CONQUISTAS.map(c => { const v = Math.min(c.valor(), c.meta), ok = !!s.conquistas[c.id];
      return `<article class="conq${ok ? ' ok' : ''}"><span class="conq-ic">${ic(c.ic, 34)}</span><b>${c.nome}</b><p>${c.desc}</p>${ok ? `<small>Conquistada em ${new Date(s.conquistas[c.id] + 'T12:00').toLocaleDateString('pt-BR')}</small>` : c.meta > 1 ? `<i class="barra"><i style="width:${pct(v, c.meta)}%"></i></i><small>${v} de ${c.meta}</small>` : '<small>Ainda não</small>'}</article>`; }).join('')}</div></section>
    <section class="ferramentas"><h2 class="titulo">Ferramentas do protótipo</h2><p>Para ver o app em outros momentos. Nada disso existe no app de verdade.</p><div class="bts">
      <button class="b3" data-f="meio">Simular: galho 2 concluído</button><button class="b3" data-f="premium">${s.premium ? 'Voltar ao grátis' : 'Simular Premium'}</button><button class="b3" data-f="energia">Zerar a energia</button><button class="b3" data-f="zera">Começar do zero</button></div></section>
  </div>`;
  const vp = $('#verPremium'); if (vp) vp.onclick = () => modalPremium();
  document.querySelectorAll('.ferramentas button').forEach(b => b.onclick = () => {
    const f = b.dataset.f;
    if (f === 'meio') { const ids = TODAS.filter(l => l.ui < 2).map(l => l.id); Estado.define({feitos: ids, xp: Math.max(Estado.get().xp, ids.length * 60), seq: Math.max(Estado.get().seq, 3), ultimoDia: new Date().toISOString().slice(0, 10)}); Estado.conclui(ids[ids.length - 1], galhosCompletos()); }
    if (f === 'premium') Estado.premium(!Estado.get().premium);
    if (f === 'energia') Estado.define({energia: 0});
    if (f === 'zera') Estado.zera();
    render(); avisoConquistas();
  });
}
const BENEF = [['energia', 'Energia sem limite.', 'No grátis são 5 por dia.'], ['galho', 'Todas as épocas e temas.', 'No grátis, o curso Oriente Antigo.'], ['cidade', 'O atlas completo.', 'Todas as camadas do mapa, com as fontes.'], ['tablete', 'Revisão inteligente.', 'O que você errou volta na hora certa.']];

// ---------- janelas ----------
function janela(html){
  const j = document.createElement('div'); j.className = 'janela'; j.innerHTML = `<div class="jan" role="dialog" aria-modal="true">${html}</div>`;
  j.onclick = e => { if (e.target === j || e.target.closest('[data-fecha]')) fecha(); };
  const fecha = () => { j.classList.add('sai'); setTimeout(() => j.remove(), 220); };
  document.body.appendChild(j); j.querySelector('button')?.focus(); return {j, fecha};
}
function modalPremium(){
  const {j, fecha} = janela(`<div class="jan-vj">${VJ.comemorando}</div><h2 class="titulo">Atlas Premium</h2><ul class="lista-p">${BENEF.map(x => `<li>${ic(x[0], 24)}<span><b>${x[1]}</b> ${x[2]}</span></li>`).join('')}</ul><p class="nota">Preço e pagamento ainda a definir. Neste protótipo dá para simular.</p><div class="bts"><button class="b3" data-fecha>Agora não</button><button class="b3 ouro" id="simP">Simular Premium</button></div>`);
  j.querySelector('#simP').onclick = () => { Estado.premium(true); fecha(); render(); };
}
function modalEnergia(semEnergia){
  const s = Estado.get();
  const {j, fecha} = janela(`<div class="hexes">${Array.from({length: Estado.ENERGIA_DIA}, (_, i) => `<span class="${s.premium || i < s.energia ? 'cheio' : ''}">${ic('energia', 34)}</span>`).join('')}</div>
    <h2 class="titulo">${s.premium ? 'Energia sem limite' : semEnergia ? 'Sua energia acabou por hoje' : `Energia: ${s.energia} de ${Estado.ENERGIA_DIA}`}</h2>
    <p>${s.premium ? 'No Premium, cada seção nova não gasta energia.' : 'Cada seção nova gasta 1 energia. Revisar o que você já fez é grátis. A energia volta a 5 todo dia.'}</p>
    <div class="bts">${!s.premium ? `<button class="b3" data-fecha>${semEnergia ? 'Revisar uma lição' : 'Entendi'}</button><button class="b3 ouro" id="vp">Energia sem limite</button>` : '<button class="b3 ouro" data-fecha>Entendi</button>'}</div>`);
  const v = j.querySelector('#vp'); if (v) v.onclick = () => { fecha(); modalPremium(); };
}

// ---------- rotas ----------
function render(){
  const h = location.hash || '#inicio';
  document.body.dataset.rota = h.split('/')[0].slice(1);
  if (h.startsWith('#arvore')) arvore(); else if (h.startsWith('#perfil')) perfil(); else inicio();
  topo(); avisoConquistas();
}
addEventListener('hashchange', () => { foco = null; render(); scrollTo(0, 0); });
addEventListener('resize', () => { clearTimeout(render._t); render._t = setTimeout(() => { if (location.hash.startsWith('#arvore')) arvore(); }, 200); });
// ao voltar da lição, o estado pode ter mudado (XP, lição concluída)
addEventListener('pageshow', () => render());
Estado.define({galhos: galhosCompletos()});
render();
})();
</script>
