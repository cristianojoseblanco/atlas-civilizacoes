<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo A · jogo vivo · Atlas das Civilizações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
:root{
  --noite:#1D2B36;--noite-chip:#2A3C4A;--papel:#FFF6E3;--carta:#FFFFFF;--contorno:#0F1A22;
  --tinta:#1D2B36;--suave:#5D5647;--claro:#FFF6E3;--nevoa:#C9D6DE;
  --ouro:#F2B33D;--ouro-esc:#C98A12;--feito:#2A9D8F;--feito-esc:#1F7A6F;--alerta:#E5644A;--alerta-esc:#B9432C;
  --certo-bg:#D7F0EA;--errado-bg:#FBE1DA;--trancado:#D9D0BC;--trancado-esc:#B4AA93;
  --mar:#3D7F8F;--terra:#F1DCA6;--rio:#2B6576;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --mola:linear(0,0.009,0.035 2.1%,0.141 4.4%,0.723 12.9%,0.938,1.077 20.4%,1.121,1.149 24.3%,1.159,1.163 27%,1.154,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);
  --titulo:'Bricolage Grotesque',system-ui,sans-serif;--texto:'Nunito Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--noite);color:var(--tinta);font-family:var(--texto);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
.titulo{font-family:var(--titulo);font-weight:800}

/* botão 3D: a borda de baixo é a espessura; ao apertar ele afunda */
.b3{position:relative;height:56px;padding:0 24px;border-radius:16px;border:3px solid var(--contorno);background:var(--carta);font-size:17px;font-weight:900;letter-spacing:.01em;box-shadow:0 5px 0 var(--contorno);transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out),background-color 160ms ease}
.b3:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--contorno)}
.b3.ouro{background:var(--ouro)}
.b3.verde{background:var(--feito);color:var(--claro)}
.b3.vermelho{background:var(--alerta);color:var(--claro)}
.b3:disabled{background:var(--trancado);color:#8A8170;border-color:var(--trancado-esc);box-shadow:0 5px 0 var(--trancado-esc);cursor:default}
@media (hover:hover){.b3:hover:not(:disabled){filter:brightness(1.04)}}

/* topo */
.topo{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:68px;padding:0 20px;background:var(--noite);color:var(--claro)}
.topo .marca{font-family:var(--titulo);font-weight:800;font-size:22px;margin-right:auto}
.chip{height:40px;display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:999px;background:var(--noite-chip);font-size:15px;font-weight:800;white-space:nowrap}
.chip .moeda{width:22px;height:22px;border-radius:50%;background:var(--ouro);border:2.5px solid var(--claro);flex:none}
.chip.pop{animation:pop 420ms var(--mola)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ===== caminho ===== */
.caminho{position:relative;max-width:720px;margin:0 auto;padding:12px 16px 160px}
.fundo-mapa{position:fixed;inset:68px 0 0 0;z-index:0;opacity:.13;pointer-events:none;background-size:cover;background-position:center}
.unidade{position:sticky;top:76px;z-index:20;display:flex;align-items:center;gap:14px;margin:14px 0 26px;padding:14px 18px;border-radius:18px;border:3px solid var(--contorno);box-shadow:0 5px 0 var(--contorno);color:var(--tinta)}
.unidade.u2{background:var(--ouro)}
.unidade.u1{background:var(--trancado)}
.unidade b{display:block;font-family:var(--titulo);font-size:21px;line-height:24px}
.unidade span{font-size:14px;font-weight:800;opacity:.8}
.unidade .guia{margin-left:auto;height:44px;padding:0 14px;border-radius:12px;border:2.5px solid var(--contorno);background:var(--papel);font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--contorno)}
.trilha{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}
.no{position:relative;width:80px;height:80px;border-radius:50%;border:3.5px solid var(--contorno);display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 var(--contorno);transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out)}
.no:active:not(:disabled){transform:translateY(7px);box-shadow:0 0 0 var(--contorno)}
.no.atual{background:var(--ouro)}
.no.feito{background:var(--feito)}
.no.trancado{background:var(--trancado);border-color:var(--trancado-esc);box-shadow:0 7px 0 var(--trancado-esc)}
.no.breve{background:transparent;border-style:dashed;border-color:#8A8170;box-shadow:none}
.no svg.ic{width:38px;height:38px}
.no .anel{position:absolute;inset:-14px;pointer-events:none}
.no .anel circle{fill:none;stroke-width:7;stroke-linecap:round}
.balao{position:absolute;bottom:calc(100% + 18px);left:50%;translate:-50% 0;padding:9px 16px;border-radius:14px;background:var(--papel);border:3px solid var(--contorno);font-weight:900;font-size:15px;white-space:nowrap;color:var(--tinta);animation:flutua 2.4s var(--ease-in-out) infinite alternate}
.balao::after{content:"";position:absolute;left:50%;top:100%;translate:-50% -2px;border:10px solid transparent;border-top-color:var(--contorno)}
@keyframes flutua{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.vj-caminho{position:absolute;width:96px;pointer-events:none;animation:respira 2.6s var(--ease-in-out) infinite alternate}
@keyframes respira{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.rotulo-no{position:absolute;top:calc(100% + 14px);left:50%;translate:-50% 0;width:180px;text-align:center;font-weight:800;font-size:14px;color:var(--claro);text-shadow:0 2px 0 var(--noite)}

/* cartão da lição (abre ao tocar no nó) */
.cartao{position:absolute;z-index:25;width:min(340px,calc(100vw - 32px));padding:18px;border-radius:20px;background:var(--ouro);border:3px solid var(--contorno);box-shadow:0 6px 0 var(--contorno);transform-origin:50% 0;animation:abre 260ms var(--ease-out)}
.cartao::before{content:"";position:absolute;left:50%;bottom:100%;translate:-50% 2px;border:12px solid transparent;border-bottom-color:var(--contorno)}
.cartao h3{font-family:var(--titulo);font-size:20px;line-height:24px}
.cartao p{font-size:15px;font-weight:700;margin:6px 0 14px;opacity:.85}
.cartao .b3{width:100%}
@keyframes abre{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}

/* ===== lição ===== */
.licao{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--papel)}
.licao-topo{flex:none;display:flex;align-items:center;gap:14px;height:68px;padding:0 20px;border-bottom:3px solid var(--contorno);background:var(--papel)}
.fechar{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;border-radius:12px}
.barra{flex:1;height:18px;border-radius:999px;background:#E9DCC2;border:3px solid var(--contorno);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--feito);border-radius:999px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 4px 0 rgba(255,255,255,.25);transition:width 500ms var(--mola)}
.licao-corpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.palco{min-height:0;overflow:auto;padding:36px max(32px,calc((100% - 600px)/2)) 40px}
.palco > *{animation:entra 320ms var(--ease-out) both}
.palco > *:nth-child(2){animation-delay:60ms}.palco > *:nth-child(3){animation-delay:120ms}.palco > *:nth-child(4){animation-delay:180ms}.palco > *:nth-child(5){animation-delay:240ms}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.palco .rot{font-size:14px;font-weight:900;color:var(--suave);margin-bottom:8px}
.palco h1{font-family:var(--titulo);font-size:34px;line-height:38px;margin-bottom:18px}
.palco h2{font-family:var(--titulo);font-size:26px;line-height:30px;margin-bottom:22px}
.palco p.txt{font-size:18px;line-height:30px;margin-bottom:16px}
.palco p.txt b{font-weight:900}
.opcoes{display:flex;flex-direction:column;gap:12px}
.op{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 16px;text-align:left;border-radius:16px;background:var(--carta);border:3px solid #CFC6B0;box-shadow:0 4px 0 #CFC6B0;font-size:17px;line-height:23px;font-weight:700;transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out),border-color 120ms ease,background-color 120ms ease}
.op .letra{width:32px;height:32px;flex:none;border-radius:9px;border:2.5px solid #CFC6B0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:var(--suave)}
.op:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 #CFC6B0}
.op.escolhida{border-color:var(--contorno);background:#FFF0C9;box-shadow:0 4px 0 var(--contorno)}
.op.escolhida .letra{border-color:var(--contorno);background:var(--ouro);color:var(--tinta)}
.op.certa{border-color:var(--feito-esc);background:var(--certo-bg);box-shadow:0 4px 0 var(--feito-esc)}
.op.certa .letra{border-color:var(--feito-esc);background:var(--feito);color:#fff}
.op.errada{border-color:var(--alerta-esc);background:var(--errado-bg);box-shadow:0 4px 0 var(--alerta-esc);animation:treme 380ms var(--ease-out)}
@keyframes treme{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.op:disabled{cursor:default}
.licao-mapa{position:relative;min-height:0;overflow:hidden;background:var(--mar);border-left:3px solid var(--contorno)}
.licao-mapa svg.campo{display:block;width:100%;height:100%}
.licao-mapa .mar{fill:var(--mar)}.licao-mapa .costa{fill:var(--contorno);stroke:var(--contorno);stroke-width:4px;stroke-linejoin:round;vector-effect:non-scaling-stroke}.licao-mapa .terra{fill:var(--terra)}.licao-mapa .lago{fill:var(--mar)}.licao-mapa .rio{fill:none;stroke:var(--rio);stroke-width:1.6px;vector-effect:non-scaling-stroke}
.cid circle{fill:var(--noite)}.cid text{font-family:var(--titulo);font-weight:800;fill:var(--noite);paint-order:stroke;stroke:var(--terra)}
#cam{transition:transform 1.4s var(--ease-in-out)}
.licao-mapa .epoca{position:absolute;left:16px;top:16px;height:40px;display:flex;align-items:center;padding:0 16px;border-radius:999px;background:var(--papel);border:3px solid var(--contorno);font-family:var(--titulo);font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--contorno)}
.licao-mapa .lugar{position:absolute;padding:5px 12px;border-radius:12px;background:var(--papel);border:3px solid var(--contorno);font-family:var(--titulo);font-weight:800;font-size:17px;white-space:nowrap;box-shadow:0 4px 0 var(--contorno);animation:abre 300ms var(--ease-out) 1.2s both}
.vj-mapa{position:absolute;width:92px;translate:-46% -94%;animation:chega 700ms var(--mola) 1.1s both}
@keyframes chega{from{opacity:0;transform:translateY(-40px) scale(.9)}to{opacity:1;transform:none}}
.licao-base{flex:none;border-top:3px solid var(--contorno);background:var(--papel);transition:background-color 200ms ease}
.licao-base .dentro{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:18px 24px 22px;min-height:96px}
.licao-base .b3{min-width:200px;margin-left:auto}
.licao-base.certo{background:var(--certo-bg)}
.licao-base.errado{background:var(--errado-bg)}
.retorno{display:flex;align-items:center;gap:14px;animation:sobe 280ms var(--ease-out)}
.retorno .selo{width:56px;height:56px;flex:none;border-radius:50%;border:3px solid var(--contorno);display:flex;align-items:center;justify-content:center}
.retorno b{display:block;font-family:var(--titulo);font-size:22px;line-height:26px}
.retorno span{font-size:15px;line-height:21px;font-weight:700;max-width:56ch;display:block}
.certo .retorno b{color:var(--feito-esc)}.errado .retorno b{color:var(--alerta-esc)}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.moeda-voa{position:fixed;z-index:90;width:28px;height:28px;border-radius:50%;background:var(--ouro);border:3px solid var(--contorno);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}

/* fim */
.fim{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:12px}
.fim .vj{width:180px;animation:pula 900ms var(--mola) both}
@keyframes pula{0%{transform:translateY(30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.fim h1{font-size:38px;line-height:42px;margin:0}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{width:150px;border-radius:16px;border:3px solid var(--contorno);overflow:hidden;box-shadow:0 5px 0 var(--contorno);animation:entra 360ms var(--ease-out) both}
.stat:nth-child(2){animation-delay:120ms}.stat:nth-child(3){animation-delay:240ms}
.stat span{display:block;padding:6px;font-size:13px;font-weight:900;color:var(--claro)}
.stat b{display:block;padding:12px 6px;background:var(--carta);font-family:var(--titulo);font-size:26px}
.confete{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confete i{position:absolute;top:-20px;width:12px;height:16px;border:2px solid var(--contorno);border-radius:3px}

@media (max-width:860px){
  .licao-corpo{display:flex;flex-direction:column}
  .licao-mapa{order:-1;height:220px;flex:none;border-left:none;border-bottom:3px solid var(--contorno)}
  .palco{padding:24px 20px 28px}
  .palco h1{font-size:28px;line-height:32px}.palco h2{font-size:23px;line-height:28px}
  .palco p.txt{font-size:17px;line-height:28px}
  .licao-base .dentro{flex-direction:column;align-items:stretch;padding:14px 16px 20px}
  .licao-base .b3{width:100%;margin-left:0}
  .vj-mapa{width:74px}
  .chip .longo{display:none}
  .topo{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
</style>
</head>
<body>
<header class="topo">
  <span class="marca">Atlas</span>
  <span class="chip" id="chipXp"><span class="moeda" aria-hidden="true"></span><span id="xp">0</span><span class="longo">&nbsp;XP</span></span>
  <span class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3c2 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 3-7 1 2 2 3 3 3 0-3-1-5 0-7z" fill="#E5644A" stroke="#FFF6E3" stroke-width="1.6"/></svg><span id="seq">3</span><span class="longo">&nbsp;dias</span></span>
  <span class="chip" aria-label="Energia"><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M9 1l8 4.5v9L9 19l-8-4.5v-9z" fill="#2A9D8F" stroke="#FFF6E3" stroke-width="1.6"/></svg><span id="en">5</span></span>
</header>
<div class="fundo-mapa" id="fundoMapa" aria-hidden="true"></div>
<main class="caminho" id="caminho"></main>
<script>/*DADOS*/</script>
<script>/*PROTO*/</script>
</body>
</html>
