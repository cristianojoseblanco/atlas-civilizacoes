<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Protótipo D · Cupertino e mapa 3D · Atlas das Civilizações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#007AFF;--verde:#34C759;--laranja:#FF9500;--vermelho:#FF3B30;--amarelo:#FFCC00;
  --cinza:#8E8E93;--cinza3:#C7C7CC;--cinza4:#D1D1D6;--cinza5:#E5E5EA;--cinza6:#F2F2F7;
  --rotulo:#1C1C1E;--rotulo2:rgba(60,60,67,.6);--rotulo3:rgba(60,60,67,.3);--preench:rgba(120,120,128,.12);--sep:rgba(60,60,67,.18);
  --vidro:rgba(250,250,252,.78);--desfoque:saturate(180%) blur(22px);
  --sombra-1:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);--sombra-2:0 10px 40px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.06);
  /* nomes que o código da lição já usa */
  --feito:var(--verde);--alerta:var(--vermelho);--ouro:var(--amarelo);--noite:#1C1C1E;--tinta:var(--rotulo);--suave:var(--rotulo2);--claro:#fff;--papel:#fff;--certo-bg:#EAF9EE;--errado-bg:#FFEDEC;
  --mar:#A9D3F0;--terra:#F2EFE9;--rio:#86BEE6;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --mola:linear(0,0.009,0.035 2.1%,0.141 4.4%,0.723 12.9%,0.938,1.077 20.4%,1.121,1.149 24.3%,1.159,1.163 27%,1.154,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);
  --fonte:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;
  --fonte-t:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cinza6);color:var(--rotulo);font-family:var(--fonte);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid rgba(0,122,255,.5);outline-offset:2px}
.titulo{font-family:var(--fonte-t);font-weight:700;letter-spacing:-.02em}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes abre{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes treme{0%,100%{translate:0}20%{translate:-7px}40%{translate:6px}60%{translate:-4px}80%{translate:2px}}
@keyframes flutua{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes pulsa{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(1.7)}}
@keyframes folha{from{transform:translateY(100%)}to{transform:none}}

/* ===== botões (iOS: cheio, tingido, cinza, simples) ===== */
.b3{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:14px;background:var(--preench);color:var(--azul);font-size:17px;font-weight:600;letter-spacing:-.01em;text-decoration:none;transition:transform 160ms var(--ease-out),background-color 160ms ease,opacity 160ms ease}
.b3:active:not(:disabled){transform:scale(.97)}
@media (hover:hover){.b3:hover:not(:disabled){filter:brightness(1.05)}}
.b3.azul,.b3.ouro{background:var(--azul);color:#fff}
.b3.verde{background:var(--verde);color:#fff}
.b3.vermelho{background:var(--vermelho);color:#fff}
.b3.tinto{background:rgba(0,122,255,.12);color:var(--azul)}
.b3.simples{background:transparent;color:var(--rotulo2)}
.b3:disabled{background:var(--preench);color:var(--rotulo3);cursor:default}

/* ===== barra de cima (vidro) ===== */
.topo{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:60px;padding:0 16px;background:var(--vidro);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);border-bottom:.5px solid var(--sep)}
.topo .marca{font-family:var(--fonte-t);font-weight:700;font-size:21px;letter-spacing:-.02em;margin-right:auto}
.chip{height:34px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;background:var(--preench);font-size:15px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .moeda{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE066,#FFB800);flex:none}
.chip.pop{animation:pop 420ms var(--mola)}
.sim{position:relative}
.sim > button{height:34px;padding:0 14px;border-radius:999px;background:rgba(0,122,255,.12);color:var(--azul);font-weight:600;font-size:15px}
.sim-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:270px;border-radius:14px;background:rgba(250,250,252,.86);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:var(--sombra-2);overflow:hidden;transform-origin:top right;animation:abre 220ms var(--ease-out)}
.sim-menu[hidden]{display:none}
.sim-menu b{display:block;padding:12px 16px 8px;font-size:13px;font-weight:500;color:var(--rotulo2)}
.sim-menu button{display:block;width:100%;text-align:left;padding:12px 16px;font-size:17px;border-top:.5px solid var(--sep)}
@media (hover:hover){.sim-menu button:hover{background:rgba(0,0,0,.05)}}
.sim-menu small{display:block;padding:10px 16px 12px;font-size:12px;color:var(--rotulo2);border-top:.5px solid var(--sep);background:rgba(0,0,0,.025)}

/* ===== trilha em árvore (lista agrupada) ===== */
.mundo{display:grid;grid-template-columns:minmax(380px,520px) minmax(0,1fr);min-height:calc(100vh - 60px)}
.caminho{width:100%;padding:16px 18px 50vh}
.galho{margin-bottom:8px}
.unidade{position:sticky;top:72px;z-index:20;display:flex;align-items:center;gap:12px;margin:8px 0 10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:var(--sombra-1)}
.unidade .aro{width:36px;height:36px;flex:none}
.unidade .aro circle{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 900ms var(--ease-out)}
.unidade span{display:block;font-size:13px;color:var(--rotulo2)}
.unidade b{display:block;font-family:var(--fonte-t);font-size:18px;line-height:23px;font-weight:600;letter-spacing:-.01em}
.unidade .estado-u{margin-left:auto;display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:var(--preench);font-size:13px;font-weight:600;color:var(--rotulo2);white-space:nowrap}
.galho.fechado .unidade b{color:var(--rotulo2)}
.req-galho{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 6px 4px;font-size:13px;color:var(--rotulo2)}
.req{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:3px 10px;border-radius:999px;background:var(--preench);color:var(--rotulo2);font-size:13px;font-weight:500;line-height:16px}
.req.ok{background:rgba(52,199,89,.15);color:#248A3D}
.arvore{position:relative;padding:46px 0 26px}
.ramos{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.ramos path{fill:none;stroke-width:3;stroke-linecap:round}
.ramos .feita{stroke:var(--verde)}.ramos .aberta{stroke:var(--azul);stroke-dasharray:.1 9}.ramos .fechada{stroke:var(--cinza4)}
.linha-arv{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:20px 14px;margin-bottom:38px}
.nowrap{position:relative;width:140px;display:flex;flex-direction:column;align-items:center}
.linha-arv.media .nowrap{width:118px}
.linha-arv.larga{gap:20px 6px}.linha-arv.larga .nowrap{width:88px}
.no{position:relative;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);transition:transform 200ms var(--ease-out),box-shadow 200ms ease}
.no:active{transform:scale(.93)}
@media (hover:hover){.no:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.08)}}
.no.feito{background:linear-gradient(180deg,#5EDB7A,#30B14F)}
.no.atual{background:linear-gradient(180deg,#3D9BFF,#0066E0)}
.no.proxima{background:#fff;box-shadow:inset 0 0 0 2px var(--laranja),0 4px 12px rgba(255,149,0,.15)}
.no.trancado{background:var(--cinza5);box-shadow:none}
.no svg.ic{width:28px;height:28px}
.linha-arv.larga .no{width:54px;height:54px}.linha-arv.larga .no svg.ic{width:24px;height:24px}
.no .anel{position:absolute;inset:-10px;pointer-events:none}
.no .anel circle{fill:none;stroke-width:6;stroke-linecap:round}
.balao{position:absolute;bottom:calc(100% + 14px);left:50%;translate:-50% 0;padding:6px 12px;border-radius:10px;background:var(--azul);color:#fff;font-weight:600;font-size:14px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,122,255,.35);animation:flutua 2.2s var(--ease-in-out) infinite alternate}
.balao::after{content:"";position:absolute;left:50%;top:100%;translate:-50% -1px;border:7px solid transparent;border-top-color:var(--azul)}
.rotulo-no{margin-top:12px;text-align:center;font-weight:600;font-size:13px;line-height:17px;color:var(--rotulo)}
.linha-arv.larga .rotulo-no{font-size:12px;line-height:15px}
.galho.fechado .rotulo-no{color:var(--rotulo2)}
.nowrap.realce .no{animation:pop 420ms var(--mola)}
.nowrap.abriu .no{animation:abriu 1.4s var(--ease-out) 2}
@keyframes abriu{0%{box-shadow:0 0 0 0 rgba(0,122,255,.55)}100%{box-shadow:0 0 0 22px rgba(0,122,255,0)}}

/* ===== cartão (popover no computador, folha no celular) ===== */
.cartao{position:absolute;z-index:25;width:min(330px,calc(100vw - 32px));padding:16px;border-radius:18px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:var(--sombra-2);transform-origin:50% 0;animation:abre 220ms var(--ease-out);text-align:left}
.cartao::before{content:"";position:absolute;left:50%;bottom:100%;translate:calc(-50% + var(--seta,0px)) 1px;border:9px solid transparent;border-bottom-color:rgba(255,255,255,.94)}
.cartao h3{font-family:var(--fonte-t);font-size:19px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.cartao .onde{margin:2px 0 12px;font-size:14px;color:var(--rotulo2)}
.cartao p{font-size:15px;line-height:20px;margin:0 0 14px;color:var(--rotulo)}
.cartao .reqs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding:12px;border-radius:12px;background:var(--cinza6)}
.cartao .reqs b{width:100%;font-size:13px;font-weight:600;color:var(--rotulo2)}
.cartao .b3{width:100%}
.cartao .b3 + .b3{margin-top:8px}
.cartao .alca{display:block;width:36px;height:5px;border-radius:3px;background:var(--cinza3);margin:0 auto 12px}
body.com-folha::after{content:"";position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.25);animation:entra 200ms ease}

/* ===== mapa 3D ===== */
.painel{position:sticky;top:60px;height:calc(100vh - 60px);overflow:hidden;perspective:1100px;perspective-origin:50% 30%;background:linear-gradient(180deg,#CFE3F6 0%,#E6F0FA 30%,var(--mar) 55%);touch-action:none;cursor:grab;user-select:none}
.painel.arrastando{cursor:grabbing}
.painel.plano{background:var(--mar)}
.cena{position:absolute;left:50%;top:58%;width:0;height:0;transform-style:preserve-3d}
.mundo3d{position:absolute;left:0;top:0;transform-style:preserve-3d;transform-origin:0 0;transition:transform 1.2s var(--ease-in-out)}
.mar-fundo{position:absolute;left:-9000px;top:-9000px;width:21000px;height:21000px;background:var(--mar)}
.chao{position:absolute;left:0;top:0;display:block}
.chao .mar{fill:var(--mar)}.chao .costa{fill:#DCD6C8;stroke:#DCD6C8;stroke-width:2px;stroke-linejoin:round}.chao .terra{fill:var(--terra)}.chao .lago{fill:var(--mar)}.chao .rio{fill:none;stroke:var(--rio);stroke-width:1.1px}
.arco{position:absolute;transform-origin:50% 100%;transform-style:flat;pointer-events:none}
.arco svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 100%;transform:scaleY(0);opacity:0;transition:transform 800ms var(--mola) var(--d,0ms),opacity 240ms ease var(--d,0ms)}
.arco.on svg{transform:none;opacity:1}
.arco path{fill:none;stroke-linecap:round;stroke-width:calc(var(--k,1) * 4px)}
.arco.feita path{stroke:var(--verde);stroke-width:calc(var(--k,1) * 5px)}
.arco.aberta path{stroke:var(--azul);stroke-dasharray:.6 2.2;animation:flui 1.2s linear infinite}
.arco.fechada path{stroke:#8E8E93;stroke-dasharray:.3 1.8;opacity:.55}
@keyframes flui{to{stroke-dashoffset:-2.8}}
.bb,.bb-chao{position:absolute;left:0;top:0;transition:transform 1.2s var(--ease-in-out),opacity 300ms ease}
.bb{width:var(--bw);height:var(--bh);margin:calc(var(--bh) * -1) 0 0 calc(var(--bw) / -2);transform-origin:50% 100%}
.pin3{--bw:56px;--bh:84px}.vjb{--bw:240px;--bh:132px}.etiqueta{--bw:300px;--bh:110px}
.bb-chao{width:22px;height:10px;margin:-5px 0 0 -11px}
.sem-trans .mundo3d,.sem-trans .bb,.sem-trans .bb-chao{transition:none!important}
.pin3 .cab{position:absolute;left:11px;top:24px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.22);transition:width 240ms var(--ease-out),height 240ms var(--ease-out),left 240ms var(--ease-out),top 240ms var(--ease-out)}
.pin3 .cab svg{width:58%;height:58%}
.pin3 .haste{position:absolute;left:26.5px;top:56px;width:3px;height:28px;border-radius:2px;background:linear-gradient(#fff,#C7C7CC)}
.pin3.feito .cab{background:var(--verde)}.pin3.atual .cab{background:var(--azul)}.pin3.proxima .cab{background:#fff;border-color:var(--laranja)}.pin3.trancado .cab{background:var(--cinza5)}
.pin3.foco .cab{left:6px;top:12px;width:44px;height:44px}
.pin3.foco .haste{top:54px;height:30px}
.pin3.foco .cab::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2.5px solid rgba(0,122,255,.6);animation:pulsa 1.8s var(--ease-out) infinite}
.pin3.longe,.sombra.longe{opacity:.22}
.sombra::before{content:"";position:absolute;left:1px;top:1px;width:20px;height:8px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(1.5px)}
.vjb{z-index:4;pointer-events:none}
.vjb .corpo{position:absolute;left:8px;top:14px;width:84px;transition:scale 200ms var(--ease-out)}
.vjb .corpo.esq{scale:-1 1}
.vjb .a{display:none}.vjb.andando.passo .a{display:block}.vjb.andando.passo .p{display:none}
.vjb svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.etiqueta span{position:absolute;left:176px;top:18px;padding:5px 11px;border-radius:10px;background:rgba(255,255,255,.92);font-weight:600;font-size:15px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.etiqueta span.troca{animation:abre 300ms var(--ease-out) 900ms both}
.nevoa{position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,#D4E6F7 0%,rgba(222,236,249,.85) 45%,rgba(222,236,249,0) 100%);pointer-events:none}
.painel.plano .nevoa{display:none}
.alvos{position:absolute;inset:0;pointer-events:none}
.alvo{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;pointer-events:auto;cursor:pointer}
.painel .epoca{position:absolute;z-index:6;left:14px;top:14px;height:36px;display:flex;align-items:center;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:0 2px 12px rgba(0,0,0,.1);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.controles{position:absolute;z-index:6;right:14px;top:14px;display:flex;gap:8px}
.seg{display:flex;padding:2px;border-radius:9px;background:rgba(255,255,255,.6);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:0 2px 12px rgba(0,0,0,.1)}
.seg button{height:32px;min-width:48px;padding:0 10px;border-radius:7px;font-size:14px;font-weight:600;color:var(--rotulo2);transition:background-color 200ms ease,color 200ms ease,box-shadow 200ms ease}
.seg button[aria-pressed="true"]{background:#fff;color:var(--rotulo);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.b-arvore{height:36px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:0 2px 12px rgba(0,0,0,.1);color:var(--azul);font-weight:600;font-size:15px;transition:transform 160ms var(--ease-out),background-color 200ms ease,color 200ms ease}
.b-arvore:active{transform:scale(.96)}
.b-arvore.on{background:var(--azul);color:#fff}
.placa{position:absolute;z-index:6;left:14px;bottom:60px;width:min(420px,calc(100% - 28px));padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:0 8px 30px rgba(0,0,0,.12)}
.placa .rot{font-size:13px;color:var(--rotulo2)}
.placa b{display:block;font-family:var(--fonte-t);font-size:19px;line-height:24px;font-weight:600;letter-spacing:-.01em;margin-top:1px}
.placa .sub{font-size:14px;color:var(--rotulo2);margin-top:2px}
.placa .sub.est-atual{color:var(--azul)}.placa .sub.est-feito{color:#248A3D}.placa .sub.est-proxima{color:#C77700}
.placa.troca{animation:entra 260ms var(--ease-out)}
.placa .reqs-placa{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legenda-arv{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--rotulo2)}
.legenda-arv span{display:flex;align-items:center;gap:6px}
.legenda-arv i{width:12px;height:12px;border-radius:50%}
.legenda-arv i.feito{background:var(--verde)}.legenda-arv i.atual{background:var(--azul)}.legenda-arv i.proxima{background:#fff;box-shadow:inset 0 0 0 2px var(--laranja)}.legenda-arv i.trancado{background:var(--cinza4)}
.regua{position:absolute;z-index:6;left:14px;right:14px;bottom:14px;height:30px;display:flex;gap:4px;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:0 2px 12px rgba(0,0,0,.1)}
.regua i{flex:1;border-radius:999px;background:var(--cinza5);transition:background-color 300ms ease}
.regua i.ativa{background:var(--cor)}
.regua .marca-t{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.06);transition:left 1.2s var(--ease-in-out)}

/* aviso */
.aviso{pointer-events:none;position:fixed;z-index:70;left:50%;top:72px;translate:-50% 0;display:flex;align-items:center;gap:12px;max-width:min(520px,calc(100vw - 24px));padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:var(--sombra-2);font-weight:600;font-size:15px;line-height:20px;animation:desce 420ms var(--mola)}
@keyframes desce{from{opacity:0;transform:translateY(-24px) scale(.96)}to{opacity:1;transform:none}}
.aviso svg.ic{width:30px;height:30px;flex:none;padding:5px;border-radius:50%;background:var(--verde)}
.aviso.sai{opacity:0;transform:translateY(-12px);transition:opacity 300ms ease,transform 300ms ease}

/* ===== lição ===== */
.licao{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#fff;animation:sobe 300ms var(--ease-out)}
.licao-topo{flex:none;display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;border-bottom:.5px solid var(--sep);background:var(--vidro);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque)}
.fechar{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--preench)}
.barra{flex:1;height:8px;border-radius:999px;background:var(--preench);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--verde);border-radius:999px;transition:width 500ms var(--mola)}
.licao-corpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.palco{min-height:0;overflow:auto;padding:36px max(28px,calc((100% - 600px)/2)) 40px}
.palco > *{animation:entra 320ms var(--ease-out) both}
.palco > *:nth-child(2){animation-delay:50ms}.palco > *:nth-child(3){animation-delay:100ms}.palco > *:nth-child(4){animation-delay:150ms}
.palco .rot{font-size:13px;font-weight:500;color:var(--rotulo2);margin-bottom:6px}
.palco h1{font-family:var(--fonte-t);font-size:32px;line-height:38px;font-weight:700;letter-spacing:-.025em;margin-bottom:16px}
.palco h2{font-family:var(--fonte-t);font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.02em;margin-bottom:20px}
.palco p.txt{font-size:18px;line-height:29px;margin-bottom:16px;color:#2C2C2E}
.palco p.txt b{font-weight:600;color:var(--rotulo)}
.opcoes{display:flex;flex-direction:column;gap:10px}
.op{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 16px;text-align:left;border-radius:14px;background:var(--cinza6);box-shadow:inset 0 0 0 2px transparent;font-size:17px;line-height:22px;transition:transform 160ms var(--ease-out),box-shadow 160ms ease,background-color 160ms ease}
.op .letra{width:26px;height:26px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 2px var(--cinza3);display:flex;align-items:center;justify-content:center;font-size:0;transition:all 160ms ease}
.op:active:not(:disabled){transform:scale(.985)}
.op.escolhida{background:rgba(0,122,255,.08);box-shadow:inset 0 0 0 2px var(--azul)}
.op.escolhida .letra{box-shadow:inset 0 0 0 8px var(--azul)}
.op.certa{background:var(--certo-bg);box-shadow:inset 0 0 0 2px var(--verde)}
.op.certa .letra{box-shadow:inset 0 0 0 13px var(--verde)}
.op.errada{background:var(--errado-bg);box-shadow:inset 0 0 0 2px var(--vermelho);animation:treme 380ms var(--ease-out)}
.op.errada .letra{box-shadow:inset 0 0 0 13px var(--vermelho)}
.op:disabled{cursor:default}
.licao-mapa{position:relative;min-height:0;overflow:hidden;background:var(--mar);border-left:.5px solid var(--sep)}
.licao-mapa svg.campo{display:block;width:100%;height:100%}
.licao-mapa .mar{fill:var(--mar)}.licao-mapa .costa{fill:#DCD6C8;stroke:#DCD6C8;stroke-width:2px;vector-effect:non-scaling-stroke}.licao-mapa .terra{fill:var(--terra)}.licao-mapa .lago{fill:var(--mar)}.licao-mapa .rio{fill:none;stroke:var(--rio);stroke-width:1.4px;vector-effect:non-scaling-stroke}
.cid circle{fill:#3A3A3C}.cid text{font-family:var(--fonte);font-weight:600;fill:#3A3A3C;paint-order:stroke;stroke:var(--terra)}
#cam{transition:transform 1.4s var(--ease-in-out)}
.licao-mapa .epoca{position:absolute;left:14px;top:14px;height:34px;display:flex;align-items:center;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:var(--desfoque);backdrop-filter:var(--desfoque);box-shadow:0 2px 12px rgba(0,0,0,.1);font-weight:600;font-size:15px}
.licao-mapa .lugar{position:absolute;padding:5px 11px;border-radius:10px;background:rgba(255,255,255,.92);font-weight:600;font-size:16px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.14);animation:abre 300ms var(--ease-out) 1.2s both}
.vj-mapa{position:absolute;width:86px;translate:-46% -94%;animation:chega 700ms var(--mola) 1.1s both;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
@keyframes chega{from{opacity:0;transform:translateY(-40px) scale(.9)}to{opacity:1;transform:none}}
.licao-base{flex:none;border-top:.5px solid var(--sep);background:#fff;transition:background-color 220ms ease}
.licao-base .dentro{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:16px 24px calc(18px + env(safe-area-inset-bottom));min-height:88px}
.licao-base .b3{min-width:190px;margin-left:auto}
.licao-base.certo{background:var(--certo-bg)}.licao-base.errado{background:var(--errado-bg)}
.retorno{display:flex;align-items:center;gap:14px;animation:sobe 280ms var(--ease-out)}
.retorno .selo{width:44px;height:44px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.retorno .selo svg{width:24px;height:24px}
.retorno > div > b{display:block;font-family:var(--fonte-t);font-size:20px;line-height:25px;font-weight:700;letter-spacing:-.01em}
.retorno > div > span{font-size:15px;line-height:21px;max-width:56ch;display:block;color:#3A3A3C}
.certo .retorno > div > b{color:#248A3D}.errado .retorno > div > b{color:#D70015}
.moeda-voa{position:fixed;z-index:90;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE066,#FFB800);box-shadow:0 4px 10px rgba(255,184,0,.4);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#7A5200}
.fim{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:12px}
.fim .vj{width:170px;animation:pula 900ms var(--mola) both}
@keyframes pula{0%{transform:translateY(30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.fim h1{font-size:34px;line-height:40px;margin:0}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{width:150px;border-radius:16px;overflow:hidden;background:var(--cinza6)!important;animation:entra 360ms var(--ease-out) both}
.stat:nth-child(2){animation-delay:100ms}.stat:nth-child(3){animation-delay:200ms}
.stat span{display:block;padding:12px 6px 0;font-size:13px;font-weight:500;color:var(--rotulo2)!important}
.stat b{display:block;padding:4px 6px 14px;font-family:var(--fonte-t);font-size:28px;font-weight:700;letter-spacing:-.02em}
.confete{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confete i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px}
.licao-topo .chip{background:var(--preench)}

@media (max-width:899px){
  .mundo{display:flex;flex-direction:column}
  .painel{order:-1;position:sticky;top:60px;z-index:26;height:240px;box-shadow:0 .5px 0 var(--sep)}
  .caminho{padding:8px 12px 50vh}
  .unidade{top:308px}
  .placa,.regua{display:none}
  .painel{perspective:1800px}
  .nevoa{height:22%;opacity:.7}
  .pin3{--bw:40px;--bh:62px}.pin3 .cab{left:8px;top:16px;width:24px;height:24px;border-width:2px}.pin3 .haste{left:18.5px;top:40px;height:22px}.pin3.foco .cab{left:4px;top:8px;width:32px;height:32px}.pin3.foco .haste{top:40px;height:22px}
  .aviso{top:66px}
  .vjb .corpo{left:40px;top:36px;width:62px}
  .etiqueta span{font-size:14px;top:26px}
  .controles{right:10px;top:10px;gap:6px}.painel .epoca{left:10px;top:10px;height:32px;font-size:14px}
  .seg button{height:28px;min-width:38px;font-size:13px}.b-arvore{height:32px;padding:0 10px;font-size:14px}
  .nowrap{width:112px}.linha-arv.media .nowrap{width:100px}.linha-arv.larga .nowrap{width:84px}
  .cartao{position:fixed!important;z-index:60;left:0!important;right:0;bottom:0;top:auto!important;translate:none!important;width:100%;border-radius:16px 16px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom));animation:folha 340ms var(--ease-out)}
  .cartao::before{display:none}
  .licao-corpo{display:flex;flex-direction:column}
  .licao-mapa{order:-1;height:210px;flex:none;border-left:none;border-bottom:.5px solid var(--sep)}
  .palco{padding:22px 20px 28px}
  .palco h1{font-size:27px;line-height:33px}.palco h2{font-size:21px;line-height:27px}
  .palco p.txt{font-size:17px;line-height:27px}
  .licao-base .dentro{flex-direction:column;align-items:stretch;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
  .licao-base .b3{width:100%;margin-left:0}
  .vj-mapa{width:66px}
  .chip .longo{display:none}
  .topo{padding:0 12px}.chip{padding:0 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
</style>
</head>

  <span class="marca">Atlas</span>
  <div class="sim"><button id="simBtn" aria-haspopup="true">Simular</button><div class="sim-menu" id="simMenu" hidden></div></div>
  <span class="chip" id="chipXp"><span class="moeda" aria-hidden="true"></span><span id="xp">0</span><span class="longo">&nbsp;XP</span></span>
  <span class="chip"><svg width="15" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c2.4 4.3 7 6.6 7 12.2a7 7 0 0 1-14 0c0-3.4 2.2-4.8 3.4-8 1.2 2.3 2.2 3.4 3.5 3.4 0-3.4-1-5.5.1-7.6z" fill="#FF9500"/></svg><span id="seq">3</span><span class="longo">&nbsp;dias</span></span>
  <span class="chip" aria-label="Energia"><svg width="15" height="17" viewBox="0 0 18 20" aria-hidden="true"><path d="M9 1l8 4.5v9L9 19l-8-4.5v-9z" fill="#34C759"/></svg><span id="en">5</span></span>
