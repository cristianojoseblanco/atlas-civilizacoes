<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Atlas das Civilizações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@1,500;1,600&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d151b;--panel:rgba(16,24,30,.92);--ink:#f3eedf;--mute:#9fa9ab;--gold:#e9b949;--line:rgba(233,185,73,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
header{z-index:8;position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:linear-gradient(var(--bg),rgba(13,21,27,0));pointer-events:none}
header h1{font-family:Cinzel,serif;font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--gold)}
header h1 small{display:block;font-family:Inter;font-weight:400;font-size:11px;letter-spacing:0;color:var(--mute)}
.toggles{display:flex;gap:6px;pointer-events:auto}
.toggles label{font-size:12px;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggles input{accent-color:var(--gold)}
.zoombtns{position:fixed;right:12px;top:64px;display:flex;flex-direction:column;gap:6px}
.zoombtns button,.ctrl button{background:var(--panel);color:var(--ink);border:1px solid var(--line);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
#hud{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(13,21,27,0),var(--bg) 28%);}
.hudtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:900px;margin:0 auto}
#year{font-family:Cinzel,serif;font-size:32px;font-weight:700;line-height:1;color:var(--ink)}
#era{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin-top:4px}
#eratext{font-size:13px;color:var(--mute);max-width:900px;margin:6px auto 2px;line-height:1.4}
#chips{max-width:900px;margin:6px auto 4px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;font:500 12px Inter,system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.12)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.route{border-style:dashed}
.chip.route i{border-radius:2px;width:12px;height:3px}
.steps{margin:10px 0 0 18px;font-size:13px;line-height:1.55;color:var(--mute)}
#news{font-size:12px;color:#ffd680;max-width:900px;margin:0 auto 10px;min-height:16px;font-style:italic}
.ctrl{display:flex;gap:6px}
.ctrl #play{background:var(--gold);color:#1a1405;border:none;font-size:15px}
.track{position:relative;max-width:900px;margin:0 auto;padding-bottom:16px}
#slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold) var(--p,50%),rgba(255,255,255,.15) var(--p,50%));outline:none}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid var(--gold);cursor:pointer}
#slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--gold);cursor:pointer}
#ticks{position:absolute;left:11px;right:11px;top:14px;height:14px}
#ticks span{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--mute);cursor:pointer;white-space:nowrap}
.legend{max-width:900px;margin:6px auto 0;font-size:11px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#card{position:fixed;left:12px;right:12px;top:88px;max-height:calc(100vh - 330px);overflow:auto;max-width:440px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;backdrop-filter:blur(8px);transform:translateY(-130%);opacity:0;transition:transform .35s ease,opacity .35s;overflow-x:hidden;z-index:5;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#card.open{transform:none;opacity:1}
#cBar{position:absolute;left:0;right:0;top:0;height:4px}
#cKind{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold)}
#cTitle{font-family:Cinzel,serif;font-size:22px;margin:4px 0 0;line-height:1.15}
#cSub{font-size:12px;color:var(--mute);font-style:italic}
#cMeta{font-size:13px;margin:10px 0;line-height:1.55}
#cMeta b{color:var(--ink);font-weight:600}
.muted{color:var(--mute);font-size:12px}
#cText{font-size:14px;line-height:1.5}
.cact{display:flex;gap:8px;margin-top:12px}
.cact a,.cact button{font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--gold);text-decoration:none;cursor:pointer;font-family:inherit}
#cClose{position:absolute;top:10px;right:10px;border:none;background:none;color:var(--mute);font-size:22px;cursor:pointer;width:32px;height:32px}
#layers{display:flex;gap:6px}
.layersbtn{display:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);width:34px;height:30px;border-radius:999px;font-size:15px;cursor:pointer}
.tourbtn{font:600 12px Inter,system-ui,sans-serif;background:var(--gold);color:#1a1405;border:none;padding:7px 12px;border-radius:999px;cursor:pointer}
#tour{position:fixed;left:12px;right:12px;top:88px;max-height:calc(100vh - 330px);overflow:auto;max-width:440px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;backdrop-filter:blur(8px);z-index:6;box-shadow:0 10px 40px rgba(0,0,0,.5);transform:translateY(-130%);opacity:0;transition:transform .4s ease,opacity .4s}
#tour:not(.open),#card:not(.open){pointer-events:none}
#tour.open{transform:none;opacity:1}
#tour.open.behind{opacity:0;pointer-events:none}
#tBar{position:absolute;left:0;right:0;top:0;height:4px}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
#tName{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
#tClose{border:none;background:none;color:var(--mute);font-size:22px;cursor:pointer;width:30px;height:30px}
#tStep{font-size:12px;color:var(--mute);margin-top:2px}
#tTitle{font-family:Cinzel,serif;font-size:21px;margin:6px 0 8px;line-height:1.2}
#tText{font-size:14px;line-height:1.55}
.t-ctrl{display:flex;align-items:center;gap:6px;margin-top:12px}
.t-ctrl button{background:transparent;color:var(--ink);border:1px solid var(--line);width:38px;height:34px;border-radius:9px;font-size:16px;cursor:pointer}
.t-ctrl button:disabled{opacity:.3}
.t-prog{flex:1;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;margin-left:6px}
.t-prog i{display:block;height:100%;width:0;background:var(--gold)}
body.touring #hud .ctrl, body.touring #chips{opacity:.35}
#tourMenu{position:fixed;inset:0;background:rgba(4,8,12,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#tourMenu.open{display:flex}
.tm-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:18px}
.tm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tm-top h2{font-family:Cinzel,serif;color:var(--gold);font-size:20px}
#tmClose{border:none;background:none;color:var(--mute);font-size:24px;cursor:pointer}
.tm-item{display:block;width:100%;text-align:left;position:relative;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 14px 12px 20px;margin-bottom:10px;cursor:pointer;color:var(--ink);font-family:inherit}
.tm-item:hover{background:rgba(255,255,255,.08)}
.tm-bar{position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:2px}
.tm-item b{display:block;font-family:Cinzel,serif;font-size:16px;margin-bottom:4px}
.tm-d{display:block;font-size:13px;color:var(--mute);line-height:1.45}
.tm-n{display:block;font-size:11px;color:var(--gold);margin-top:6px}
.credit{position:fixed;right:8px;bottom:2px;font-size:9px;color:rgba(160,170,170,.5);pointer-events:auto}
.credit a{color:inherit}
@media (max-width:600px){ header h1{font-size:14px;white-space:nowrap} header h1 small{display:none} .tourbtn{padding:6px 10px;font-size:12px} .toggles{gap:6px;position:relative} .layersbtn{display:block} #layers{display:none;position:absolute;right:0;top:38px;flex-direction:column;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px} #layers.open{display:flex} #layers label{border:none;background:none} .toggles label{padding:5px 8px;font-size:11px} }
@media (min-width:760px){ #tour{left:auto;right:16px;top:64px;max-height:calc(100vh - 260px);margin:0;width:380px} #tour:not(.open){transform:translateX(120%)} #card{left:auto;right:16px;top:64px;max-height:calc(100vh - 260px);margin:0;width:380px} #card:not(.open){transform:translateX(120%)} .zoombtns{top:auto;bottom:190px} }
</style>
</head>
<body>
<canvas id="map"></canvas>
<header>
  <h1>Atlas das Civilizações<small>Fronteiras do mundo ao longo do tempo</small></h1>
  <div class="toggles">
    <button id="btnTours" class="tourbtn">▶ Passeios</button>
    <button id="btnLayers" class="layersbtn" aria-label="Camadas">☰</button>
    <div id="layers">
    <label><input type="checkbox" id="tPlaces" checked>Lugares</label>
    <label><input type="checkbox" id="tRoutes" checked>Rotas</label>
    <label><input type="checkbox" id="tLabels" checked>Nomes</label>
    </div>
  </div>
</header>
<div class="zoombtns"><button id="zin" aria-label="Aproximar">+</button><button id="zout" aria-label="Afastar">−</button></div>

<div id="hud">
  <div class="hudtop">
    <div><div id="year"></div><div id="era"></div></div>
    <div class="ctrl"><button id="prev" aria-label="Anterior">‹</button><button id="play" aria-label="Reproduzir">▶</button><button id="next" aria-label="Próximo">›</button></div>
  </div>
  <div id="eratext"></div><div id="chips"></div><div id="news"></div>
  <div class="track"><input type="range" id="slider" min="0" step="1"><div id="ticks"></div></div>
  <div class="legend"><span><i style="background:hsl(30 70% 58%)"></i>Estados e impérios</span><span><i style="background:transparent;border:1px dashed #9a8f7a"></i>Povos e culturas</span><span><i style="background:#fff6df;border-radius:50%;border:2px solid #2a1c0e"></i>Cidades</span><span><i style="background:#f0c454;transform:rotate(45deg) scale(.8)"></i>Sítios</span></div>
</div>

<div id="card">
  <div id="cBar"></div><button id="cClose" aria-label="Fechar">×</button>
  <div id="cKind"></div>
  <div id="cTitle"></div>
  <div id="cSub"></div>
  <div id="cMeta"></div>
  <div id="cText"></div>
  <div class="cact"><a id="cLink" target="_blank" rel="noopener">Ler na Wikipédia ↗</a><button id="cJump">Ir para quando surge</button></div>
</div>
<div id="tour">
  <div id="tBar"></div>
  <div class="t-head"><span id="tName"></span><button id="tClose" aria-label="Sair do passeio">×</button></div>
  <div id="tStep"></div>
  <div id="tTitle"></div>
  <div id="tText"></div>
  <div class="t-ctrl"><button id="tPrev" aria-label="Parada anterior">‹</button><button id="tAuto" aria-label="Pausar ou continuar">❚❚</button><button id="tNext" aria-label="Próxima parada">›</button><div class="t-prog"><i id="tProg"></i></div></div>
</div>
<div id="tourMenu"><div class="tm-box"><div class="tm-top"><h2>Passeios guiados</h2><button id="tmClose" aria-label="Fechar">×</button></div><div id="tmList"></div></div></div>
<div class="credit">Fronteiras: <a href="https://github.com/aourednik/historical-basemaps" target="_blank" rel="noopener">historical-basemaps</a> (GPL-3), aproximadas · Relevo e rios: Natural Earth</div>

</body>
</html>
